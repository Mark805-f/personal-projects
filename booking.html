<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Booking - Voyage Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">V</span>
                Voyage <span>Elite</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="booking.html">Book Now</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="section">
        <h2 class="section-title heading-font">Complete Your Booking</h2>
        <div class="booking-container">
            <div>
                <h3>Trip Details</h3>
                <p><strong>Nothing Picked</strong></p>
                <p>Nothing Picked</p>
                
                <h3 style="margin-top: 2rem;">Traveler Information</h3>
                <input type="text" placeholder="Full Name" style="width:100%; padding:15px; margin:10px 0; border-radius:12px; border:1px solid #ddd;">
                <input type="email" placeholder="Email Address" style="width:100%; padding:15px; margin:10px 0; border-radius:12px; border:1px solid #ddd;">
            </div>
            
            <div style="background:#f8fafc; padding:2rem; border-radius:20px;">
                <h3>Booking Summary</h3>
                <p>No details: <strong>$0</strong></p>
                <p>Total: <strong style="font-size:2rem; color:var(--primary);">$0</strong></p>
                <button
                        style="width:100%; padding:18px; background:var(--primary); color:white; border:none; border-radius:9999px; font-size:1.1rem; margin-top:1.5rem;">
                    Confirm & Pay
                </button>
            </div>
        </div>
    </section>

</body>
</html>
