<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Voyage Elite</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">V</span>
                Voyage <span>Elite</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="destinations.html">Destinations</a></li>
                <li><a href="booking.html">Book Now</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <section class="section">
        <h2 class="section-title heading-font">Get in Touch</h2>
        <div style="max-width:700px; margin:0 auto; text-align:center;">
            <p style="font-size:1.3rem; margin-bottom:2rem;">Our travel experts are ready to craft your dream journey.</p>
            
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:2rem; margin-top:3rem;">
                <div>
                    <i class="fas fa-phone fa-2x" style="color:var(--primary);"></i>
                    <h3>+1 (555) 123-4567</h3>
                    <p>24/7 Travel Support</p>
                </div>
                <div>
                    <i class="fas fa-envelope fa-2x" style="color:var(--primary);"></i>
                    <h3>hello@voyageelite.com</h3>
                    <p>Response within 4 hours</p>
                </div>
            </div>

            <form style="margin-top:3rem;">
                <input type="text" placeholder="Your Name" required style="width:100%; padding:15px; margin:10px 0; border-radius:12px;">
                <input type="email" placeholder="Email Address" required style="width:100%; padding:15px; margin:10px 0; border-radius:12px;">
                <textarea placeholder="Tell us about your dream trip..." rows="5" style="width:100%; padding:15px; margin:10px 0; border-radius:12px;"></textarea>
                <button type="submit"
                        style="padding:16px 40px; background:var(--primary); color:white; border:none; border-radius:9999px; font-size:1.1rem;">
                    Send Message
                </button>
            </form>
        </div>
    </section>

</body>
</html>
